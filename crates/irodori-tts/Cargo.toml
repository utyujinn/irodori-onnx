[package]
name = "irodori-tts"
version = "0.0.0"
edition = "2021"
description = "Pure-Rust runtime for Irodori-TTS (v4.1 MeanFlow) on ONNX Runtime. Work in progress."
license = "MIT"
publish = false

[dependencies]
ebur128 = "0.1.10"
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.11", features = ["load-dynamic", "cuda"] }
rand = "0.10.3"
rand_distr = "0.6.0"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
